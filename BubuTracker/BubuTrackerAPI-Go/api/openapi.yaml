openapi: 3.0.3
info:
  title: BubuTracker API
  version: "1.0"
  description: >
    Location-tracking API for the BubuTracker app. All routes except the
    health checks require a valid Auth0 access token.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: process is alive }
  /readyz:
    get:
      summary: Readiness probe (checks database connectivity)
      security: []
      responses:
        "200": { description: ready to serve traffic }
        "503": { description: database unreachable }
  /api/v1/users/me:
    get:
      summary: Get (and lazily provision) my profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Partially update my profile
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Delete my account
      description: >
        Removes the user row, which cascades to their stored location and
        every tracking edge they're part of, as either tracker or tracked
        user (migration 000005). Irreversible; does not revoke the Auth0
        identity itself, so signing in again afterwards provisions a fresh,
        empty account for the same Auth0 subject.
      responses:
        "204": { description: account deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/locations/me:
    post:
      summary: Upsert my current location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLocationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: request body too large }
  /api/v1/locations/tracked:
    get:
      summary: Locations of the users I track
      description: >
        Accepted tracking only. Pending requests never appear here — they
        are listed on GET /tracking/outgoing with profile fields only (no
        coordinates).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrackedLocation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tracking:
    get:
      summary: List the users I track (accepted only)
      description: >
        Only users whose tracking request I sent has been accepted; a
        pending request I'm still waiting on doesn't appear here.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Request to track a user by email
      description: >
        Creates a pending request; the target user must accept it (see
        POST /tracking/requests/{trackerID}/accept) before I get any
        location visibility into their account. Rate limited (10/minute per
        user): the 404-vs-201/409 distinction below is enough to enumerate
        registered emails if left unthrottled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddTrackingRequest" }
      responses:
        "201": { description: tracking request sent }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: no user with that email }
        "409": { description: already requested or already tracking this user }
        "429": { description: rate limit exceeded }
  /api/v1/tracking/{trackedUserID}:
    delete:
      summary: Cancel my pending request, or stop tracking a user
      parameters:
        - name: trackedUserID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: removed (idempotent) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tracking/outgoing:
    get:
      summary: List pending tracking requests I have sent
      description: >
        Profile-only list of people I'm waiting on. No location fields —
        consent has not been granted yet. After they accept, they appear
        on GET /locations/tracked instead.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tracking/requests:
    get:
      summary: List other users' pending requests to track me
      description: >
        The consent inbox: requests I haven't accepted or rejected yet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tracking/requests/{trackerID}/accept:
    post:
      summary: Accept a pending request to track me
      description: >
        Grants trackerID visibility into my location. No-op-unsafe: fails
        with 404 if there's no such pending request (already accepted,
        rejected, or it never existed).
      parameters:
        - name: trackerID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: no pending request from that user }
  /api/v1/tracking/followers:
    get:
      summary: List users currently tracking me, with my consent
      description: >
        Ongoing visibility into who has access, not just at request time -
        use DELETE on this resource to revoke a follower.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/tracking/followers/{trackerID}:
    delete:
      summary: Reject a pending request, or revoke an accepted follower
      parameters:
        - name: trackerID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: removed (idempotent) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0-issued access token
  responses:
    BadRequest:
      description: invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: invalid_argument }
            message: { type: string }
    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        createdAt: { type: string, format: date-time }
    UpdateUserRequest:
      type: object
      description: A field omitted (or null) leaves the existing value unchanged.
      properties:
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
    Location:
      type: object
      properties:
        userId: { type: string, format: uuid }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        updatedAt: { type: string, format: date-time }
    TrackedLocation:
      type: object
      description: >
        latitude/longitude/updatedAt are null if this tracked user hasn't
        reported a location yet — they still appear in the list rather than
        being silently omitted. Only accepted tracking edges are included.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        markerColor: { type: string }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    UpdateLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    AddTrackingRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
