name: BubuTracker API (Go) CI

on:
  push:
    branches: [main]
    paths:
      - "BubuTracker/BubuTrackerAPI-Go/**"
      - ".github/workflows/bubutracker-api-go-ci.yml"
  pull_request:
    paths:
      - "BubuTracker/BubuTrackerAPI-Go/**"
      - ".github/workflows/bubutracker-api-go-ci.yml"

defaults:
  run:
    working-directory: BubuTracker/BubuTrackerAPI-Go

jobs:
  test:
    runs-on: ubuntu-latest

    # A service container, not testcontainers: this gives every test in the
    # job plain localhost:5432 connectivity with no Docker-in-Docker
    # networking to fight, and it's the same Postgres image the app already
    # uses in deploy/docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bubutracker
          POSTGRES_PASSWORD: bubutracker
          POSTGRES_DB: bubutracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bubutracker:bubutracker@localhost:5432/bubutracker?sslmode=disable
      TEST_DATABASE_URL: postgres://bubutracker:bubutracker@localhost:5432/bubutracker?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: BubuTracker/BubuTrackerAPI-Go/go.mod

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet (including integration-tagged files)
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Apply migrations
        run: go run ./cmd/migrate -direction up

      - name: Unit tests
        run: go test ./... -cover

      - name: Integration tests (internal/store against real Postgres)
        run: go test -tags=integration ./internal/store/... -v
