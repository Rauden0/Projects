services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobmatcher
      POSTGRES_PASSWORD: jobmatcher
      POSTGRES_DB: jobmatcher
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatcher"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    # Default credentials, so nothing is published beyond localhost. Set AMQP_BIND=0.0.0.0
    # only if a publisher outside this compose network (JobIngestor) must reach it over the host.
    ports: ["${AMQP_BIND:-127.0.0.1}:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 10

  # Local LLM. First run: docker compose exec ollama ollama pull qwen2.5:7b
  # CPU only here; with an NVIDIA GPU add -f docker-compose.gpu.yml.
  ollama:
    image: ollama/ollama:0.40.18
    ports: ["127.0.0.1:11434:11434"]
    environment:
      # The default 4096-token window is silently truncated from the start (the system prompt)
      # once a chat has a few turns: one agent question alone reaches ~3.3k tokens.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes: [ollama:/root/.ollama]

  migrate:
    build: .
    image: jobmatcher:latest
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    init: true
    env_file: .env
    volumes: [models:/models]
    # Localhost only; a public deployment puts a TLS proxy in front (docs/deploy.md).
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    init: true
    env_file: .env
    volumes: [models:/models]
    command: ["python", "-m", "jobmatcher.ingest.worker"]
    environment:
      OTEL_SERVICE_NAME: jobmatcher-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  # With EXTRACTION_MODE=batch the worker stores heuristic facts and this service extracts
  # the pending jobs once an hour through the Message Batches API (half the token price).
  batch-extract:
    profiles: ["batch"]
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    init: true
    env_file: .env
    command: ["python", "-m", "jobmatcher.ingest.batch_extract", "--every", "3600"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  outbox-relay:
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    init: true
    env_file: .env
    command: ["python", "-m", "jobmatcher.outbox.relay"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  # Deletes CVs after CV_RETENTION_DAYS, client addresses on usage rows after two days and
  # published outbox rows after OUTBOX_RETENTION_DAYS.
  retention:
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    init: true
    env_file: .env
    command: ["python", "-m", "jobmatcher.retention", "--every", "3600"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Trace viewer: `docker compose --profile phoenix up -d`, then set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006 in .env and recreate api and worker.
  # UI and OTLP/HTTP on http://localhost:6006; traces are kept in the phoenix volume (SQLite).
  phoenix:
    profiles: ["phoenix"]
    image: arizephoenix/phoenix:version-22
    restart: unless-stopped
    # Phoenix 22 turns auth on by default, which rejects OTLP without an API key. Without it
    # the UI must stay on localhost; the api and worker reach it over the compose network.
    ports: ["127.0.0.1:6006:6006"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_DISABLE_AGENT_ASSISTANT: "true"
    volumes: [phoenix:/mnt/data]

volumes:
  pgdata:
  ollama:
  models:
  phoenix:
