services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobmatcher
      POSTGRES_PASSWORD: jobmatcher
      POSTGRES_DB: jobmatcher
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatcher"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 10

  # Local LLM. First run: docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    environment:
      # The default 4096-token window is silently truncated from the start (the system prompt)
      # once a chat has a few turns: one agent question alone reaches ~3.3k tokens.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  migrate:
    build: .
    image: jobmatcher:latest
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    env_file: .env
    volumes: [models:/models]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    env_file: .env
    volumes: [models:/models]
    command: ["python", "-m", "jobmatcher.ingest.worker"]
    environment:
      OTEL_SERVICE_NAME: jobmatcher-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  # With EXTRACTION_MODE=batch the worker stores heuristic facts and this service extracts
  # the pending jobs once an hour through the Message Batches API (half the token price).
  batch-extract:
    profiles: ["batch"]
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "jobmatcher.ingest.batch_extract", "--every", "3600"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  outbox-relay:
    build: .
    image: jobmatcher:latest
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "jobmatcher.outbox.relay"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  # Trace viewer: `docker compose --profile phoenix up -d`, then set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006 in .env and recreate api and worker.
  # UI and OTLP/HTTP on http://localhost:6006; traces are kept in the phoenix volume (SQLite).
  phoenix:
    profiles: ["phoenix"]
    image: arizephoenix/phoenix:version-22
    restart: unless-stopped
    ports: ["6006:6006"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes: [phoenix:/mnt/data]

volumes:
  pgdata:
  ollama:
  models:
  phoenix:
