services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobmatcher
      POSTGRES_PASSWORD: jobmatcher
      POSTGRES_DB: jobmatcher
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatcher"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 10

  # Local LLM. First run: docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes: [models:/models]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes: [models:/models]
    command: ["python", "-m", "jobmatcher.ingest.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "jobmatcher.ingest.scheduler"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  outbox-relay:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "jobmatcher.outbox.relay"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
  ollama:
  models:
