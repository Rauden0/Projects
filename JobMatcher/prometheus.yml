# Used by the `metrics` compose profile. Recording rules and alerts for the SLOs are in
# docs/observability.md.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9100"] }]
  - job_name: outbox-relay
    static_configs: [{ targets: ["outbox-relay:9100"] }]
