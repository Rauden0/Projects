# Labelled postings for the extraction eval (eval/run_extraction.py).
# Synthetic, modelled on real Czech and EU ads (companies are fictional). The product is
# occupation-neutral, so about half are non-IT: care, driving, trades, office, retail, food.
#
# Gold conventions, matching EXTRACTION_SYSTEM:
# - A field may be a list of acceptable values when the ad is honestly ambiguous; null means
#   "the posting does not say" and is a value like any other.
# - seniority: only from the title or an explicit level ("senior", "junior", "medior"/"mid").
# - years: the minimum number of years explicitly required.
# - remote: onsite | hybrid | remote_country | remote_region | remote_global. Inherently
#   on-site jobs (driving, care, trades) that never say so accept onsite or null.
# - salary: as written (monthly CZK stays monthly, annual EUR stays annual), currency ISO.
# - salary: hourly, daily or per-lesson rates also accept null (mixing them with monthly pay
#   in one column misleads filters more than a missing value does).
# - skills: the hard skills and tools the ad asks for; an item may be a list of synonyms
#   (Czech ads are often answered in Czech). Scored by recall and precision against everything
#   the model put into tech + req + nice.

