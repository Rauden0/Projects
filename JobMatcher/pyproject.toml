[project]
name = "jobmatcher"
version = "0.1.0"
description = "Job postings ingestion, hybrid search and an LLM agent that matches them to a CV."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aio-pika>=9.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.30",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
# Only needed to export traces (OTEL_EXPORTER_OTLP_ENDPOINT); without it the API is a no-op.
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
dev = [
    "jobmatcher[otel]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a migrated Postgres (TEST_DATABASE_URL) and RabbitMQ (TEST_AMQP_URL)",
    "e2e: whole pipeline in process against Postgres and RabbitMQ; optionally a real LLM",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["jobmatcher"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true
